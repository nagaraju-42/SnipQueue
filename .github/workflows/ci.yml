name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, staging, develop]

jobs:
  lint-and-test-api:
    name: API — Lint, Type Check, Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: snipq
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: snipq_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm prisma generate
      - run: pnpm lint
      - run: pnpm type-check
      - name: Run DB migrations (test DB)
        env:
          DATABASE_URL: postgresql://snipq:testpass@localhost:5432/snipq_test
          DIRECT_URL: postgresql://snipq:testpass@localhost:5432/snipq_test
        run: pnpm prisma migrate deploy
      - name: Run tests
        env:
          DATABASE_URL: postgresql://snipq:testpass@localhost:5432/snipq_test
          DIRECT_URL: postgresql://snipq:testpass@localhost:5432/snipq_test
          UPSTASH_REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_secret_for_ci_only_32chars_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          JWT_ACCESS_EXPIRES: 15m
          JWT_REFRESH_EXPIRES: 7d
          NODE_ENV: test
          PORT: 4000
          FRONTEND_URL: http://localhost:3000
          RESEND_API_KEY: re_test_key
          EMAIL_FROM: test@test.com
          RAZORPAY_KEY_ID: rzp_test_xxx
          RAZORPAY_KEY_SECRET: test_secret
          RAZORPAY_WEBHOOK_SECRET: test_webhook_secret
          FIREBASE_PROJECT_ID: test-project
          FIREBASE_CLIENT_EMAIL: test@test.iam.gserviceaccount.com
          FIREBASE_PRIVATE_KEY: test_key
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test_anon_key
          SUPABASE_SERVICE_ROLE_KEY: test_service_key
        run: pnpm test

  lint-and-build-web:
    name: Web — Lint, Type Check, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          NEXT_PUBLIC_WS_URL: http://localhost:4000
          NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_xxx
